name: Sync Google Sheet to CSV

on:
  # Run on a schedule (every 1 hour)
  schedule:
    - cron: '0 */6 * * *'  # Every 1 hours
  
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run Google Sheet sync
        run: python3 scripts/sync_google_sheet.py
      
      - name: Check if CSV changed
        id: check_changes
        run: |
          if git diff --quiet docs/product_data.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/product_data.csv
          git commit -m "🔄 Auto-sync: Update product data from Google Sheet [skip ci]"
          git push
      
      - name: Notify sync status
        run: |
          if [ "${{ steps.check_changes.outputs.changed }}" = "true" ]; then
            echo "CSV updated from Google Sheet and pushed to repository"
          else
            echo "No changes detected in Google Sheet"
          fi
